# Local development only: hardcoded credentials, no TLS, Postgres reachable
# from your machine. Do not deploy this file -- see TODO.md.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # ${VAR:-default} uses the environment variable if set, otherwise the default.
      # Credentials must match the postgres service below.
      ConnectionStrings__Db: ${DB_CONNECTION:-Host=postgres;Database=hakutaku;Username=hakutaku;Password=hakutaku;GSS Encryption Mode=Disable}
      # Password for the seeded owner account `admin`, so a fresh local setup has
      # a known login (the readme tells people to use it). Only read while the
      # database has no admins: an existing pgdata volume keeps its old password.
      HAKUTAKU_ADMIN_PASSWORD: ${HAKUTAKU_ADMIN_PASSWORD:-hakutaku}
    depends_on:
      postgres:
        # Wait until Postgres accepts connections, not just until the container
        # starts. The app runs migrations on boot and crashes if the database
        # isn't up yet -- on a first run, initdb takes a few seconds.
        condition: service_healthy
    ports:
      # Mirrors compose.yaml: the shared Caddyfile is default-deny, so reach the
      # UI here rather than through Caddy on :80. In production the same port is
      # reached over an SSH tunnel instead.
      - "127.0.0.1:8090:8080"

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hakutaku
      POSTGRES_PASSWORD: hakutaku
      POSTGRES_DB: hakutaku
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. During initdb Postgres listens on a
      # unix socket only, so this correctly reports unhealthy until it's really
      # ready for the app to connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hakutaku -d hakutaku"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      # Bound to localhost so the database is not reachable from the network.
      # Lets you connect with pgAdmin/DBeaver at localhost:5432.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      # The wiki, to match the documented port. Caddy serves it here
      # because the Caddyfile is shared with compose.yaml.
      - "5020:5020"
    environment:
      # Caddyfile is shared with compose.yaml; locally, plain HTTP on :80.
      HAKUTAKU_DOMAIN: ":80"
      # Plain HTTP on :5020 -- a bare port can never get a certificate.
      HAKUTAKU_DOCS_DOMAIN: ":5020"
    volumes:
      # Mount the directory, not the file: a single-file bind mount pins the
      # inode, and git replaces files rather than editing them, so the container
      # would keep serving stale config until recreated.
      - ./caddy:/etc/caddy:ro
    depends_on:
      - app
      - docs

  docs:
    # The wiki in docs/, live-served rather than built. Reachable only through
    # caddy -- no `ports:` here, so it is not published on the host.
    image: squidfunk/mkdocs-material
    restart: unless-stopped
    command: serve --dev-addr 0.0.0.0:5020
    volumes:
      # The whole repo, read-only: mkdocs.yml sits at the root, and a
      # single-file bind mount would pin its inode so edits never appear
      # (same trap as the Caddyfile mount above).
      - ./:/docs:ro

volumes:
  pgdata:
