# Production deploy: real domain + automatic HTTPS via Caddy. Requires a
# `.env` next to this file with real POSTGRES_PASSWORD and HAKUTAKU_DOMAIN
# values -- see .env.example. Do not confuse this with compose.dev.yaml,
# which is local-only and must never be deployed.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ConnectionStrings__Db: Host=postgres;Database=hakutaku;Username=hakutaku;Password=${POSTGRES_PASSWORD};SSL Mode=Disable
      HAKUTAKU_ADMIN_PASSWORD: ${HAKUTAKU_ADMIN_PASSWORD:-}
      # Outgoing mail for verification and password-reset codes. All optional: with
      # no SMTP_HOST the app logs each message instead of sending it (see .env.example).
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
    ports:
      # Caddy on 443 stays the sole public entry point
      # Host port 8090 because Jenkins already holds 8080.
      - "127.0.0.1:8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hakutaku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hakutaku
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hakutaku -d hakutaku"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql
    # No `ports:` here on purpose -- only reachable from other containers on
    # this compose network, never from the internet.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"   # required for the ACME challenge + http->https redirect
      - "443:443"
    environment:
      HAKUTAKU_DOMAIN: ${HAKUTAKU_DOMAIN}
      # Derived, so no new .env entry is needed. nip.io resolves any
      # prefix, so docs.<ip>.nip.io already points at this host.
      HAKUTAKU_DOCS_DOMAIN: docs.${HAKUTAKU_DOMAIN}
    volumes:
      # Mount the directory, not the file: a single-file bind mount pins the
      # inode, and git replaces files rather than editing them, so the container
      # would keep serving stale config until recreated.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data       # issued certificates + ACME account key
      - caddy_config:/config
    depends_on:
      - app
      - docs

  docs:
    # The wiki in docs/, live-served rather than built. Reachable only through
    # caddy -- no `ports:` here, so it is not published on the host.
    # Pinned: this third-party image runs on a public port, so it only changes
    # when someone bumps the tag on purpose.
    image: squidfunk/mkdocs-material:9.7.7
    restart: unless-stopped
    command: serve --dev-addr 0.0.0.0:5020
    volumes:
      # Only what the wiki needs, read-only. Not the whole repo: that would
      # hand .git and any .env with production secrets to this container.
      # mkdocs.yml is a single-file mount, which pins its inode, so a pulled
      # change to it only shows once the container is recreated (the
      # Jenkinsfile does that on every deploy). docs/ is a directory, so page
      # edits show at once.
      - ./docs:/docs/docs:ro
      - ./mkdocs.yml:/docs/mkdocs.yml:ro

volumes:
  pgdata:
  caddy_data:
  caddy_config:
